<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing Task 1 — Graphs &amp; Process · Pre-IELTS</title>
<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#1f2733; --muted:#5b6672; --line:#d9e0ea;
  --brand:#1f5fa8; --brand-2:#2b7de0; --brand-soft:#e8f1fb; --accent:#0f9d7a;
  --good:#1a8a55; --good-soft:#e2f4ea; --bad:#c0392b; --bad-soft:#fdecea;
  --warn:#b8860b; --warn-soft:#fbf3dd; --lock:#8a93a0;
  --c1:#2b7de0; --c2:#e07b39; --c3:#0f9d7a; --c4:#8e5cc9; --c5:#c0504d; --c6:#3aa0a0; --c7:#b8860b;
  --shadow:0 1px 2px rgba(20,40,80,.06),0 6px 20px rgba(20,40,80,.06);
  --radius:14px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --panel:#161d27; --ink:#e7edf5; --muted:#9aa7b6; --line:#2a3644;
    --brand:#5aa2ec; --brand-2:#6fb0f2; --brand-soft:#16283e; --accent:#3fd0a8;
    --good:#43c98a; --good-soft:#12301f; --bad:#ff7a6b; --bad-soft:#3a1512;
    --warn:#e8c266; --warn-soft:#2e2609; --lock:#6b7787;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --ink:#e7edf5; --muted:#9aa7b6; --line:#2a3644;
  --brand:#5aa2ec; --brand-2:#6fb0f2; --brand-soft:#16283e; --accent:#3fd0a8;
  --good:#43c98a; --good-soft:#12301f; --bad:#ff7a6b; --bad-soft:#3a1512;
  --warn:#e8c266; --warn-soft:#2e2609; --lock:#6b7787;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
a{color:var(--brand-2)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.orgbar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;padding:6px 12px}
.orgbar .org-name{color:var(--muted);font-weight:600;font-size:.82rem;letter-spacing:.3px}
.orgbar .org-tag{font-size:.64rem;font-weight:700;letter-spacing:.09em;color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.topbar{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;padding:14px 0}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{font-weight:800;font-size:1.12rem;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.brandmark .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:16px}
.topbar .spacer{flex:1}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600}
.iconbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:9px;padding:6px 10px;font-size:.85rem;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.28)}
.teacher-banner{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line);text-align:center;font-weight:700;font-size:.92rem;padding:7px 12px}

.tabs{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px;scrollbar-width:thin}
.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:9px 12px;border-radius:9px 9px 0 0;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink);background:var(--brand-soft)}
.tab.active{color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 -3px 0 var(--brand)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.tab .dot.done{background:var(--good)}
.tab .dot.part{background:var(--warn)}
.tab .lockico{font-size:.85rem}

main{padding:22px 0 70px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:0 0 18px}
.card h2{font-size:1.28rem;color:var(--brand)}
.lead{color:var(--muted)}
.kicker{text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:700;color:var(--brand-2);margin-bottom:4px}
.lesson h3{font-size:1.02rem;margin-top:18px;display:flex;align-items:center;gap:8px}
.lesson h3 .ic{width:24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:.85rem;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:linear-gradient(180deg,var(--brand-soft),transparent)}
.box.plain{background:var(--panel)}
.box h4{margin:0 0 6px;font-size:.95rem}
table.vocab{width:100%;border-collapse:collapse;font-size:.92rem}
table.vocab td,table.vocab th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.vocab th{background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--brand-soft);color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.83rem;font-weight:600}
.eg{background:var(--good-soft);border-left:4px solid var(--good);border-radius:0 9px 9px 0;padding:9px 13px;margin:8px 0;font-size:.93rem}
.eg b{color:var(--good)}
.tip{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 9px 9px 0;padding:9px 13px;margin:8px 0;font-size:.93rem}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.struct{counter-reset:st;display:grid;gap:9px;margin-top:8px}
.struct .step{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.struct .step:before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}

/* charts */
.chartwrap{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px;margin:10px 0}
.chartwrap svg{display:block;width:100%;height:auto}
.chartwrap img{display:block;width:100%;height:auto;border-radius:8px;background:#fff}
.figcap{font-size:.82rem;color:var(--muted);text-align:center;margin-top:6px}

/* exercises */
.exercise{border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}
.exhead{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--brand-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.exhead .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.exhead h4{margin:0;font-size:1rem}
.exhead .area{font-size:.74rem;color:var(--muted);font-weight:600}
.exhead .status{margin-left:auto;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:6px}
.exbody{padding:15px}
.exbody .instr{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.item{padding:9px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:0}
.qline{display:flex;gap:8px;align-items:baseline}
.qnum{color:var(--brand-2);font-weight:700;flex:none}
.qtext{flex:1}
.item input[type=text]{width:150px;max-width:60%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:.95rem}
.item select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:.92rem;max-width:100%}
.item input[type=number]{width:56px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);text-align:center}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:5px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opts label:hover{background:var(--brand-soft)}
.opts input{margin-top:4px}
.mark{margin-left:8px;font-weight:700}
.mark.ok{color:var(--good)}
.mark.no{color:var(--bad)}
.ans{display:none;margin-top:5px;font-size:.86rem;color:var(--good);background:var(--good-soft);border-radius:7px;padding:4px 9px}
.ans.show{display:block}
.item.correct input,.item.correct select{border-color:var(--good);background:var(--good-soft)}
.item.wrong input,.item.wrong select{border-color:var(--bad);background:var(--bad-soft)}
.item input.gapin{width:132px;max-width:70%;padding:2px 8px;border:0;border-bottom:2px solid var(--brand);border-radius:5px 5px 0 0;background:var(--brand-soft);color:var(--ink);font-size:.98rem;font-weight:600;text-align:center;vertical-align:baseline;margin:0 3px}
.item input.gapin:focus{outline:none;border-bottom-color:var(--brand-2);background:var(--panel)}
.item.correct input.gapin{border-bottom-color:var(--good);background:var(--good-soft)}
.item.wrong input.gapin{border-bottom-color:var(--bad);background:var(--bad-soft)}
.exfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 15px;border-top:1px solid var(--line);background:var(--panel)}
.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 11px;font-size:.83rem}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.scorebox{font-weight:800;font-size:1.02rem}
.scorebox small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}
.meta{font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.gatemsg{font-size:.83rem;color:var(--muted)}
.gatemsg.lock{color:var(--lock)}

/* header/identity */
.field{margin:10px 0}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
.field input{width:100%;max-width:360px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:1rem}
.saveline{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:4px}
.saveline .blip{width:8px;height:8px;border-radius:50%;background:var(--good)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.map a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel)}
.map a:hover{border-color:var(--brand);background:var(--brand-soft)}
.map .t{font-weight:700;color:var(--brand)}
.map .d{font-size:.8rem;color:var(--muted)}

/* exam practice */
.prompt{background:var(--brand-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-style:italic}
.wordcount{font-size:.85rem;color:var(--muted)}
.wordcount b{color:var(--ink)}
textarea{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:15px/1.6 inherit;resize:vertical}
.feedback{margin-top:12px;border:1px solid var(--line);border-radius:11px;overflow:hidden;display:none}
.feedback.show{display:block}
.fbhead{padding:11px 14px;background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bandnum{font-size:1.7rem;font-weight:800;line-height:1}
.critrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-bottom:1px solid var(--line)}
.crit{padding:11px 14px;border-right:1px solid var(--line)}
.crit .cn{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.crit .cb{font-weight:800;font-size:1.1rem}
.fbbody{padding:13px 15px}
.fbbody h4{margin:8px 0 5px;font-size:.9rem}
.descref{overflow:auto;margin:8px 0;border-radius:10px}
.bandtable{border-collapse:collapse;font-size:.82rem;min-width:780px;width:100%}
.bandtable th,.bandtable td{border:1px solid var(--line);padding:8px 9px;vertical-align:top}
.bandtable thead th{text-align:center;font-weight:800;background:var(--panel)}
.bandtable thead th.h4{color:var(--bad);border-top:3px solid var(--bad)}
.bandtable thead th.h5{color:var(--warn);border-top:3px solid var(--warn)}
.bandtable thead th.h6{color:var(--brand);border-top:3px solid var(--brand)}
.bandtable thead th.h7{color:var(--good);border-top:3px solid var(--good)}
.bandtable th.critname{text-align:left;background:var(--panel);color:var(--ink);min-width:118px;font-weight:700;font-size:.86rem}
.bandtable th.critname .cnote{display:block;font-weight:500;color:var(--muted);font-size:.75rem;margin-top:3px}
.bandtable td.b4{background:var(--bad-soft)}
.bandtable td.b5{background:var(--warn-soft)}
.bandtable td.b6{background:var(--brand-soft)}
.bandtable td.b7{background:var(--good-soft)}
.bandtable ul{margin:0;padding-left:15px}
.bandtable li{margin:3px 0;line-height:1.4}
.bandlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin:8px 0}
.bandlegend span{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.bandlegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mistakes{margin-top:12px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;background:var(--warn-soft);padding:11px 15px}
.mistakes h4{margin:0 0 6px;color:var(--warn);font-size:.96rem}
.mistakes ul{margin:0;padding-left:18px}
.mistakes li{margin:5px 0}
.model{display:none;margin-top:12px;border:1px dashed var(--brand);border-radius:10px;padding:12px 14px;background:var(--brand-soft)}
.model.show{display:block}
.model h4{margin:0 0 8px;color:var(--brand)}
.modelcompare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.modelcompare{grid-template-columns:1fr}}
.mcol{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--panel)}
.mlabel{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.mlabel.b65{color:var(--brand);background:var(--brand-soft);border:1px solid var(--line)}
.mlabel.b7{color:var(--good);background:var(--good-soft);border:1px solid var(--line)}
.mcol p{margin:.5em 0;font-size:.94rem}
.mcol p:first-of-type{margin-top:0}
.mcol p:last-of-type{margin-bottom:0}

/* report */
table.report{width:100%;border-collapse:collapse;font-size:.9rem}
table.report th,table.report td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.report th{background:var(--brand-soft);color:var(--brand)}
table.report td.c{text-align:center}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700}
.badge.mast{background:var(--good-soft);color:var(--good)}
.badge.rev{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--line);color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:6px 0 14px}
.stat{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--panel)}
.stat .v{font-size:1.5rem;font-weight:800;color:var(--brand)}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600}
.revlist{margin:6px 0;padding-left:20px}
.revlist li{margin:4px 0}
.setup{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--panel)}
.setup code,code{background:var(--brand-soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.85em}
pre.code{background:#0d1117;color:#d6e2f0;border-radius:10px;padding:13px;overflow:auto;font-size:.8rem;line-height:1.5;border:1px solid var(--line)}
details{border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:10px 0;background:var(--panel)}
details summary{cursor:pointer;font-weight:700;color:var(--brand)}
.footnote{color:var(--muted);font-size:.8rem}
.hidden{display:none!important}
@media print{.tabs,.topbar,.exfoot .btn,.iconbtn{display:none!important}.panel{display:block!important}}
</style>
</head>
<body>
<div class="orgbar"><span class="org-name">Huong Stella Paradigm</span><span class="org-tag">PRE-IELTS</span></div>
<div class="topbar"><div class="wrap">
  <div class="brandmark"><span class="logo">✍️</span> IELTS Writing Task&nbsp;1 · Graphs &amp; Process</div>
  <span class="pill" id="verPill">Student</span>
  <div class="spacer"></div>
  <span class="pill" id="whoPill" style="display:none"></span>
  <button class="iconbtn" id="themeBtn" title="Toggle light / dark">🌓 Theme</button>
</div></div>
<div class="teacher-banner" id="teacherBanner" style="display:none">👩‍🏫 TEACHER VERSION — all answer keys and model answers are shown</div>

<div class="tabs"><div class="wrap" id="tabnav"></div></div>

<main><div class="wrap" id="panels"></div></main>

<script>
/* ============================ CONFIG ============================ */
var TEACHER_MODE = true;
var GOOGLE_SCRIPT_URL = ""; // ← teacher: paste your Google Apps Script Web App URL here (see Results tab)
var PASS = 0.8;             // answers unlock at 80%

/* ============================ SVG CHART HELPERS ============================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function svgLine(o){
  var W=560,H=340,pl=44,pr=140,pt=34,pb=42, iw=W-pl-pr, ih=H-pt-pb;
  var ymax=o.ymax, yst=o.ystep||Math.round(ymax/5), n=o.xs.length;
  var xf=function(i){return pl+(n<2?iw/2:iw*i/(n-1));};
  var yf=function(v){return pt+ih-ih*v/ymax;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
  s+='<text x="'+(W/2)+'" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">'+esc(o.title)+'</text>';
  for(var g=0;g<=ymax+0.001;g+=yst){var y=yf(g);
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(pl+iw)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".14"/>';
    s+='<text x="'+(pl-7)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".75">'+(o.yfmt?o.yfmt(g):g)+'</text>';}
  for(var i=0;i<n;i++){s+='<text x="'+xf(i)+'" y="'+(pt+ih+16)+'" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".8">'+esc(o.xs[i])+'</text>';}
  o.series.forEach(function(se,si){
    var col=se.color||('var(--c'+((si%7)+1)+')'),d='';
    se.data.forEach(function(v,i){d+=(i?'L':'M')+xf(i).toFixed(1)+' '+yf(v).toFixed(1)+' ';});
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.6" '+(se.dash?'stroke-dasharray="'+se.dash+'"':'')+' stroke-linejoin="round"/>';
    se.data.forEach(function(v,i){s+='<circle cx="'+xf(i).toFixed(1)+'" cy="'+yf(v).toFixed(1)+'" r="2.6" fill="'+col+'"/>';});
    var ly=pt+8+si*20;
    s+='<line x1="'+(pl+iw+12)+'" y1="'+ly+'" x2="'+(pl+iw+34)+'" y2="'+ly+'" stroke="'+col+'" stroke-width="2.6" '+(se.dash?'stroke-dasharray="'+se.dash+'"':'')+'/>';
    s+='<text x="'+(pl+iw+40)+'" y="'+(ly+4)+'" font-size="11.5" fill="currentColor">'+esc(se.name)+'</text>';

  s+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ih)+'" stroke="currentColor" stroke-opacity=".4"/>';

  return s+'</svg>';
}
function svgBar(o){
  var W=560,H=350,pl=46,pr=120,pt=34,pb=70, iw=W-pl-pr, ih=H-pt-pb;
  var ymax=o.ymax, yst=o.ystep||Math.round(ymax/5), cats=o.cats, ng=o.groups.length;
  var bw=iw/cats.length, inner=bw*0.72, gw=inner/ng;
  var yf=function(v){return pt+ih-ih*v/ymax;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
  s+='<text x="'+(W/2)+'" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">'+esc(o.title)+'</text>';
  for(var g=0;g<=ymax+0.001;g+=yst){var y=yf(g);
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(pl+iw)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".14"/>';
    s+='<text x="'+(pl-7)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".75">'+g+'</text>';}
  cats.forEach(function(c,ci){
    var x0=pl+bw*ci+(bw-inner)/2;
    o.groups.forEach(function(gr,gi){
      var v=gr.data[ci],x=x0+gw*gi,y=yf(v),col=gr.color||('var(--c'+((gi%7)+1)+')');
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(gw-3).toFixed(1)+'" height="'+(pt+ih-y).toFixed(1)+'" rx="2" fill="'+col+'"/>';
    });
    s+='<text x="'+(pl+bw*ci+bw/2)+'" y="'+(pt+ih+15)+'" text-anchor="end" font-size="10.5" fill="currentColor" fill-opacity=".8" transform="rotate(-32 '+(pl+bw*ci+bw/2)+' '+(pt+ih+15)+')">'+esc(c)+'</text>';
  });
  o.groups.forEach(function(gr,gi){var ly=pt+8+gi*20,col=gr.color||('var(--c'+((gi%7)+1)+')');
    s+='<rect x="'+(pl+iw+12)+'" y="'+(ly-9)+'" width="14" height="13" rx="2" fill="'+col+'"/>';
    s+='<text x="'+(pl+iw+31)+'" y="'+(ly+2)+'" font-size="11.5" fill="currentColor">'+esc(gr.name)+'</text>';});
  s+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(pt+ih)+'" stroke="currentColor" stroke-opacity=".4"/>';
  s+='<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt+ih)+'" stroke="currentColor" stroke-opacity=".4"/>';
  if(o.ylabel) s+='<text x="14" y="'+(pt+ih/2)+'" font-size="11" fill="currentColor" fill-opacity=".7" transform="rotate(-90 14 '+(pt+ih/2)+')" text-anchor="middle">'+esc(o.ylabel)+'</text>';
  return s+'</svg>';
}
function svgPie(o){
  var W=430,H=300,cx=128,cy=150,r=104;
  var tot=o.slices.reduce(function(a,b){return a+b.value;},0),ang=-Math.PI/2;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
  s+='<text x="'+(W/2)+'" y="18" text-anchor="middle" font-size="13.5" font-weight="700" fill="currentColor">'+esc(o.title)+'</text>';
  o.slices.forEach(function(sl,i){
    var a2=ang+2*Math.PI*sl.value/tot,large=(a2-ang)>Math.PI?1:0,col=sl.color||('var(--c'+((i%7)+1)+')');
    var x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    s+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+col+'" stroke="var(--panel)" stroke-width="1.5"/>';
    var mid=(ang+a2)/2,lr=r*0.62;
    var pct=Math.round(100*sl.value/tot);
    if(pct>=7) s+='<text x="'+(cx+lr*Math.cos(mid)).toFixed(1)+'" y="'+(cy+lr*Math.sin(mid)+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+pct+'%</text>';
    ang=a2;
  });
  o.slices.forEach(function(sl,i){var ly=54+i*22,col=sl.color||('var(--c'+((i%7)+1)+')');
    s+='<rect x="'+(cx+r+26)+'" y="'+(ly-10)+'" width="13" height="13" rx="2" fill="'+col+'"/>';
    s+='<text x="'+(cx+r+44)+'" y="'+(ly+1)+'" font-size="11.5" fill="currentColor">'+esc(sl.name)+'</text>';});
  return s+'</svg>';
}
function chartHTML(ch){
  var inner = ch.kind==='line'?svgLine(ch): ch.kind==='bar'?svgBar(ch): ch.kind==='pie'?svgPie(ch):
     ch.kind==='pies'? '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+ch.pies.map(svgPie).join('')+'</div>':
     ch.kind==='img'? '<img src="'+IMG[ch.src]+'" alt="'+esc(ch.alt||'')+'">':'';
  return '<div class="chartwrap">'+inner+(ch.cap?'<div class="figcap">'+esc(ch.cap)+'</div>':'')+'</div>';
}

/* -------- EXAM PRACTICE TASKS -------- */
var EXAM = [
 {id:'X_line',type:'Line graph',min:150,tenseHint:'past',
  prompt:'The line graph below shows the percentage of tourists to Scotland who visited four different attractions in Edinburgh. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.',
  words:'Write at least 150 words.',chart:CH.edinburgh,
  model:`The line graph shows the percentage of tourists in Scotland who visited four attractions in Edinburgh — the Aquarium, the Castle, the Zoo and the Festival — from 1980 to 2010.\n\nOverall, the Castle was the most popular attraction for most of the period, while the number of people visiting the Aquarium fell a lot by the end. The Festival stayed the most stable.\n\nIn 1980, 20% of tourists visited the Aquarium. This figure increased to 35% in 1985, but after that it decreased to about 8% in 2010. The Castle was different. It started at 30% and rose to 45% in 1995, and then it decreased to just over 30% and stayed at this level.\n\nThe Zoo had the lowest figures for much of the time. It went up and down between 10% and 15%, but in 2010 it rose to 20%. The Festival did not change much and remained at around 26% during the thirty years.`,
  model7:`The line graph illustrates the proportion of tourists to Scotland who visited four attractions in Edinburgh — the Aquarium, the Castle, the Zoo and the Festival — over the thirty-year period from 1980 to 2010.\n\nOverall, the Castle was clearly the most popular attraction throughout most of the period, whereas the Aquarium, having peaked early on, experienced the most dramatic decline. The Festival, by contrast, remained remarkably stable.\n\nIn 1980, the Aquarium attracted 20% of visitors and then climbed sharply to a peak of 35% in 1985. After this, however, its popularity declined overall, reaching a low of just 8% by 2010. The Castle followed the opposite trend, rising from 30% to a high of 45% in 1995 before levelling off at just above 30% for the rest of the period.\n\nThe Zoo drew the smallest proportion of tourists for much of the time, fluctuating between 9% and 15%, although it recovered to 20% in 2010. Meanwhile, the Festival held steady at approximately 26% across the entire period.`,
  mistakes:['Putting numbers in the overview — give only the main trend there, and save the data for the body paragraphs.','Using the wrong tense — these years are in the past, so use the past simple (rose, fell), not the present.','Describing every single point — select the key features (peaks, lowest points, big changes) instead of listing every year.','Mixing up adjective and adverb — "a sharp rise" (adjective + noun) but "rose sharply" (verb + adverb).']},
 {id:'X_bar',type:'Bar chart',min:150,tenseHint:'past',
  prompt:'The bar chart below shows the number of students who chose certain university subjects in 2005. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.',
  words:'Write at least 150 words.',chart:CH.university,
  model:`The bar chart shows the number of male and female students, in thousands, who chose eight university subjects in 2005.\n\nOverall, more men than women studied the sciences and mathematics, while more women chose social sciences and languages.\n\nThe most popular subject for men was the Sciences, with 22 thousand students. Mathematics and Literature were also popular with men. In these subjects there were more men than women. For example, 19 thousand men studied Mathematics, but only 5 thousand women did.\n\nFor women, the most popular subject was Social Sciences, which about 25 thousand women chose. This was the highest number on the chart. Languages were also more popular with women (19 thousand) than men (only 2 thousand). In The Arts, more women (10 thousand) than men (3 thousand) took part. In Humanities, the numbers were the same, at 12 thousand each, while in Literature and Law there were more men than women.`,
  model7:`The bar chart compares the number of male and female students, in thousands, who chose eight different university subjects in 2005.\n\nOverall, men were in the majority in the sciences and mathematics, whereas women dominated the social sciences, languages and the arts. Only in humanities were the two groups equal.\n\nThe sciences were the most popular choice among men, selected by 22,000 students, followed by mathematics (19,000) and literature (16,000). In each of these subjects men clearly outnumbered women; the widest gap appeared in mathematics, where 19,000 men chose the subject compared with just 5,000 women.\n\nWomen, on the other hand, favoured the social sciences, which around 25,000 chose — the highest figure for either sex on the chart. Languages revealed the most striking difference of all: 19,000 women opted for them, against only 2,000 men. Women also outnumbered men in the arts, while in literature and law men were ahead. In humanities, both sexes were represented equally, at 12,000 students.`,
  mistakes:['Forgetting to compare — a bar chart is about differences, so use "more than", "whereas" and "the highest".','Listing every bar with no overview — group the information first (e.g. men led in the sciences), then add the details.','Misreading the units — check whether the axis shows thousands, percentages or numbers, and stay consistent.','Overusing "slightly" — only use it for small gaps; a difference of nearly double is not slight.']},
 {id:'X_pie',type:'Pie charts',min:150,tenseHint:'past',
  prompt:'The pie charts below show the share of Oscar winners by film genre for 2003 and 2008. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.',
  words:'Write at least 150 words.',chart:CH.oscars,
  model:`The two pie charts show the percentage of Oscar winners by film genre in 2003 and 2008.\n\nOverall, comedy won the largest share of awards in 2003, but by 2008 action films had become the most successful genre. Science fiction also grew strongly, while comedy became less popular.\n\nIn 2003, comedy was the most successful genre, with about a quarter of the awards (24%). Action came second at 20%, and romance was third at 15%. Documentary and science fiction each had around 10%, and horror had the smallest share, at 8%.\n\nIn 2008, the situation changed. Action rose to 28% and became the top genre, and science fiction increased to 20%, moving into second place. On the other hand, comedy fell to 18% and romance dropped to 10%. Horror and documentary had the smallest shares, with less than 10% each. Thrillers were the only genre that did not change, staying at 12% in both years.`,
  model7:`The two pie charts compare the share of Oscar winners across seven film genres in 2003 and 2008.\n\nOverall, the awards became more concentrated in action and science-fiction films over the five years, while comedy, which had led in 2003, lost ground. Horror consistently attracted the fewest winners.\n\nIn 2003, comedy claimed the largest share, at almost a quarter (24%) of all awards, followed by action at 20% and romance at 15%. Documentary and science fiction each accounted for around 10%, and horror trailed with just 8%.\n\nBy 2008, the ranking had shifted considerably. Action had risen to 28% to become the leading genre, and science fiction had doubled its share to 20%, overtaking comedy to take second place. Comedy itself slipped to 18%, and romance fell to 10%. Horror and documentary remained the least successful, each accounting for under 10%, while thrillers were the only genre to hold steady, at 12% in both years.`,
  mistakes:['Forgetting it is about proportions — use "the proportion / percentage of" and fractions (a quarter, a third), not only raw numbers.','Not comparing the two charts — when there are two pies, describe what changed over time.','Confusing per cent and percentage — use per cent with a number (20 per cent) and percentage with words (a small percentage).','Naming the biggest slice without checking — confirm which category is actually largest in each year.']},
 {id:'X_proc',type:'Process',min:150,tenseHint:'passive',
  prompt:'The diagrams show the greenhouse effect on the temperature of the Earth. Describe the process.',
  words:'Write at least 150 words.',chart:{kind:'img',src:'greenhouse',alt:'Greenhouse effect: sun radiation, some scattered/absorbed, Earth warmed; greenhouse gases trap heat; pollution increases gases and Earth becomes warmer'},
  model:`The three diagrams show how the greenhouse effect makes the Earth warmer, and how pollution can make this effect stronger.\n\nOverall, heat from the sun is trapped by gases in the atmosphere, and pollution from people increases the amount of these gases.\n\nIn the first stage, heat radiation is sent from the sun to the Earth. Some of this heat is scattered from the atmosphere (about 6%), a further 19% is absorbed by the atmosphere and clouds, and 20% is scattered and reflected by clouds. About half of the heat (51%) is absorbed by the Earth, and so the Earth is warmed.\n\nNext, the greenhouse gases in the atmosphere trap the heat and reflect it back to the Earth. This keeps the Earth warm enough for life, although some heat is lost at night. Finally, when there is more pollution, the amount of greenhouse gases increases. More heat is trapped, and as a result the Earth becomes warmer.`,
  model7:`The three diagrams illustrate the process of the greenhouse effect and show how human pollution can intensify it, raising the temperature of the Earth.\n\nOverall, it is clear that heat from the sun is partly trapped by gases in the atmosphere, and that increased pollution strengthens this warming effect.\n\nIn the first stage, heat radiation from the sun travels towards the Earth. A small amount is scattered by the atmosphere (roughly 6%), a further 19% is absorbed by the atmosphere and clouds, and around 20% is reflected back by clouds. The remaining heat — about 51% — is absorbed by the Earth’s surface, which is consequently warmed.\n\nIn the second stage, the greenhouse gases already present in the atmosphere trap some of this heat and reflect it back towards the Earth, keeping the planet warm enough to support life, although a proportion escapes at night. Finally, as pollution raises the concentration of greenhouse gases, more heat is trapped and reflected, and the Earth becomes progressively warmer.`,
  mistakes:['Using the active instead of the passive — most steps have no doer, so write "the wheat is cut", not "they cut the wheat".','Leaving out sequence words — use First, Next, Then and Finally, or When / After clauses, to show the order.','Copying the labels word for word — expand each label into a full sentence with articles and prepositions.','Adding opinions or reasons — only describe the stages shown; do not explain why or give your own view.']}
];

var DESCR = {
 TA:{name:'Task Achievement', note:'Did you answer the whole task, with a clear overview and the key features?',

   }},
 LR:{name:'Lexical Resource', note:'Is the vocabulary varied, accurate and used correctly?',
   bands:{

    6:['Adequate range of vocabulary for the task','Tries less common words, but with some mistakes','Some spelling / word-form errors, but meaning is still clear'],
    7:['Enough vocabulary used with some flexibility and precision','Uses less common words with awareness of style and collocation','Only a few errors in spelling / word form']
   }},
 GRA:{name:'Grammatical Range & Accuracy', note:'Are the sentences varied and grammatically correct, with good punctuation?',
   bands:{
    4:['Uses only a very limited range of structures','Rarely uses complex (subordinate) clauses','Frequent grammar and punctuation errors'],
    5:['Limited range of structures','Tries complex sentences, but they are less accurate than simple ones','Frequent grammar / punctuation errors may cause some difficulty'],
    6:['Uses a mix of simple and complex sentence forms','Makes some grammar and punctuation errors','Errors rarely stop the reader understanding'],
    7:['Uses a variety of complex structures','Produces many error-free sentences','Good control of grammar and punctuation, with only a few errors']
   }}
};

<script>
/* ============================ ENGINE ============================ */
var state = load() || {identity:{name:'',email:''}, ex:{}, essays:{}, tab:'start', theme:''};
function blankEx(){return {best:0,attempts:0,time:0,revealed:false,answers:null,checked:false};}
Object.keys(EXDATA).forEach(function(k){EXDATA[k].forEach(function(ex){ if(!state.ex[ex.id]) state.ex[ex.id]=blankEx(); });});
EXAM.forEach(function(x){ if(!state.essays[x.id]) state.essays[x.id]={text:'',words:0,fb:null}; });

/* ---- persistence ---- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} markSaved(); }
function load(){ try{ var s=localStorage.getItem(STORE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
var lastSaved=0;
function markSaved(){ var el=document.getElementById('saveStamp'); if(el){ var d=new Date(); el.textContent='Saved '+d.toLocaleTimeString(); } lastSaved=Date.now(); }

/* ---- tabs ---- */
var TABS=[
 {id:'start',label:'Start here',icon:'🏠'},
 {id:'line',label:'Line graphs',icon:'📈'},
 {id:'bar',label:'Bar charts',icon:'📊'},
 {id:'pie',label:'Pie charts',icon:'🥧'},
 {id:'proc',label:'Process',icon:'⚙️'},
 {id:'exam',label:'Exam practice',icon:'📝'},
 {id:'report',label:'Results & report',icon:'🎯'}
];
var SKILL=['line','bar','pie','proc'];

function tabStatus(tid){
 if(!EXDATA[tid]) return null;
 var arr=EXDATA[tid], done=0, part=0;
 arr.forEach(function(ex){ var st=state.ex[ex.id]; if(st.best>=PASS) done++; else if(st.checked) part++; });
 if(done===arr.length) return 'done';
 if(done+part>0) return 'part';
 return '';
}
function examUnlocked(){
 if(TEACHER_MODE) return true;
 return SKILL.every(function(tid){ return EXDATA[tid].every(function(ex){ return state.ex[ex.id].checked; }); });
}
function examRemaining(){
 var rem=[];
 SKILL.forEach(function(tid){ EXDATA[tid].forEach(function(ex){ if(!state.ex[ex.id].checked) rem.push(ex.id); }); });
 return rem;
}

function renderTabs(){
 var nav=document.getElementById('tabnav'); nav.innerHTML='';
 TABS.forEach(function(t){
  var b=document.createElement('button'); b.className='tab'+(state.tab===t.id?' active':''); b.dataset.tab=t.id;
  var dot=''; var stt=tabStatus(t.id);
  if(stt!==null) dot='<span class="dot '+(stt==='done'?'done':stt==='part'?'part':'')+'"></span>';
  var lock=(t.id==='exam'&&!examUnlocked())?'<span class="lockico">🔒</span>':'';
  b.innerHTML=t.icon+' '+t.label+' '+dot+lock;
  b.onclick=function(){ go(t.id); };
  nav.appendChild(b);
 });
}
function go(tid){ activeEx=null; state.tab=tid; save(); renderTabs(); renderPanels(); window.scrollTo(0,0); }

/* ---- render all panels ---- */
function renderPanels(){
 var host=document.getElementById('panels'); host.innerHTML='';
 host.appendChild(panelStart());
 SKILL.forEach(function(tid){ host.appendChild(panelSkill(tid)); });
 host.appendChild(panelExam());
 host.appendChild(panelReport());
 // activate
 Array.prototype.forEach.call(host.children,function(p){ p.classList.toggle('active', p.dataset.tab===state.tab); });
 wireInputs();
 // restore marks/score for exercises already checked (so progress survives tab switches)
 Object.keys(EXDATA).forEach(function(k){ EXDATA[k].forEach(function(ex){ paintEx(ex.id); }); });
}

/* ---- helpers to build a panel ---- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ===== START PANEL ===== */
function panelStart(){
 var p=document.createElement('section'); p.className='panel'; p.dataset.tab='start';
 p.innerHTML=`
 <div class="card">

function exerciseHTML(ex,n){

 var statusTxt = st.best>=PASS? '<span style="color:var(--good)">✓ Mastered '+pct(st.best)+'</span>' : st.checked? '<span style="color:var(--warn)">Best '+pct(st.best)+'</span>':'<span style="color:var(--muted)">Not started</span>';

 var chart= ex.chart? chartHTML(ex.chart):'';
 return `<div class="exercise" data-ex="${ex.id}" id="ex-${ex.id}">

function itemHTML(ex,it,i){
 var id=ex.id+'_'+i, saved=(state.ex[ex.id].answers||{})[i];
 var mark='<span class="mark" id="mk-'+id+'"></span>';
 var qtext;
 if(it.t==='gap'){
   var input='<input type="text" class="gapin" id="in-'+id+'" autocomplete="off" spellcheck="false" value="'+(saved!=null?escAttr(saved):'')+'">';
   // put the input right where the blank (___) is, so students type into the gap in the sentence
   qtext = /_{2,}/.test(it.q) ? it.q.replace(/_{2,}/, function(){ return input+mark; }) : (it.q+' '+input+mark);
 } else {
   qtext = it.q + inputFor(it,id,saved) + mark;
 }
 return '<div class="item" data-item="'+i+'" id="it-'+id+'"><div class="qline"><span class="qnum">'+(i+1)+'.</span><div class="qtext">'+qtext+'</div></div>'+ansLine(ex,it,id)+'</div>';
}
function inputFor(it,id,saved){
 if(it.t==='gap') return ' <input type="text" id="in-'+id+'" autocomplete="off" spellcheck="false" value="'+(saved!=null?escAttr(saved):'')+'">';
 if(it.t==='order') return ' <input type="number" min="1" max="20" id="in-'+id+'" value="'+(saved!=null?escAttr(saved):'')+'"> <span class="footnote">order #</span>';
 if(it.t==='sel'){ var o='<select id="in-'+id+'"><option value="">— choose —</option>'+it.opts.map(function(op,j){return '<option value="'+j+'"'+(String(saved)===String(j)?' selected':'')+'>'+esc(op)+'</option>';}).join('')+'</select>'; return ' '+o; }
 if(it.t==='mc'||it.t==='tf'){
   var opts = it.t==='tf'? ['True','False'] : it.opts;
   var o='<div class="opts">'+opts.map(function(op,j){var checked=(String(saved)===String(j))?' checked':''; return '<label><input type="radio" name="'+id+'" value="'+j+'"'+checked+'> <span>'+esc(op)+'</span></label>';}).join('')+'</div>';
   return o;
 }
 return '';
}
function ansLine(ex,it,id){
 var a= it.t==='gap'? it.a.join(' / ') : it.t==='order'? ('position '+it.a) : it.t==='tf'? (it.a?'True':'False') : (it.opts[it.a]);
 var reveal = TEACHER_MODE || (state.ex[ex.id] && state.ex[ex.id].best>=PASS);
 return '<div class="ans'+(reveal?' show':'')+'" id="an-'+id+'">✓ Answer: <b>'+esc(a)+'</b></div>';
}

/* ---- repaint a checked exercise's marks/score after a re-render (no state change) ---- */
function paintEx(exid){
 var ex=findEx(exid), st=state.ex[exid];
 if(!ex||!st||!st.checked||!st.answers) return;
 var correct=0, n=ex.items.length;
 ex.items.forEach(function(it,i){
   var val=st.answers[i], ok=itemCorrect(it,val); if(ok) correct++;
   var itnode=document.getElementById('it-'+exid+'_'+i), mk=document.getElementById('mk-'+exid+'_'+i);
   if(itnode) itnode.classList.remove('correct','wrong');
   if(mk){ mk.className='mark'; mk.textContent=''; }
   if(val!=null&&val!==''){ if(itnode) itnode.classList.add(ok?'correct':'wrong'); if(mk){ mk.className='mark '+(ok?'ok':'no'); mk.textContent=ok?'✓':'✗'; } }
 });
 var sc=document.getElementById('sc-'+exid), score=n?correct/n:0;
 if(sc) sc.innerHTML='<span style="color:'+(score>=PASS?'var(--good)':'var(--bad)')+'">'+correct+' / '+n+' = '+pct(score)+'</span>';
}
/* ---- checking ---- */
function readItem(ex,it,i){
 var id=ex.id+'_'+i, node=document.getElementById('in-'+id);
 if(it.t==='mc'||it.t==='tf'){ var r=document.querySelector('input[name="'+id+'"]:checked'); return r?r.value:null; }
 return node?node.value:null;
}
function itemCorrect(it,val){
 if(val==null||val==='') return false;
 if(it.t==='gap'){ var v=norm(val); return it.a.some(function(a){return norm(a)===v;}); }
 if(it.t==='order') return String(parseInt(val,10))===String(it.a);
 if(it.t==='tf') return String(val)===String(it.a?0:1);
 return String(val)===String(it.a); // mc, sel
}
function checkEx(exid){
 var ex=findEx(exid), st=state.ex[exid], correct=0, ans={};
 ex.items.forEach(function(it,i){
   var val=readItem(ex,it,i); ans[i]=val;
   var ok=itemCorrect(it,val);
   if(ok) correct++;
   var itnode=document.getElementById('it-'+exid+'_'+i);
   var mk=document.getElementById('mk-'+exid+'_'+i);
   itnode.classList.remove('correct','wrong');
   if(val!=null&&val!==''){ itnode.classList.add(ok?'correct':'wrong'); mk.className='mark '+(ok?'ok':'no'); mk.textContent=ok?'✓':'✗'; }
   else { mk.className='mark'; mk.textContent=''; }
 });
 var score=correct/ex.items.length;
 st.attempts++; st.checked=true; st.answers=ans; if(score>st.best) st.best=score;
 var reveal = TEACHER_MODE || st.best>=PASS;
 st.revealed = reveal;
 // score box
 var sc=document.getElementById('sc-'+exid);
 sc.innerHTML= '<span style="color:'+(score>=PASS?'var(--good)':'var(--bad)')+'">'+correct+' / '+ex.items.length+' = '+pct(score)+'</span>'+
   '<small>'+(score>=PASS?'Great — 80%+! Answers unlocked.':'Below 80% — answers stay hidden. Fix the ✗ and try again.')+'</small>';
 document.getElementById('at-'+exid).textContent=st.attempts;
 document.getElementById('st-'+exid).innerHTML = st.best>=PASS? '<span style="color:var(--good)">✓ Mastered '+pct(st.best)+'</span>':'<span style="color:var(--warn)">Best '+pct(st.best)+'</span>';
 // reveal answers?
 ex.items.forEach(function(it,i){ var an=document.getElementById('an-'+exid+'_'+i); if(an) an.classList.toggle('show',reveal); });
 save(); renderTabs();
 if(state.tab!=='report') { /* keep */ }
}
function resetEx(exid){
 var ex=findEx(exid);
 ex.items.forEach(function(it,i){
   var id=exid+'_'+i;
   if(it.t==='mc'||it.t==='tf'){ var r=document.querySelector('input[name="'+id+'"]:checked'); if(r) r.checked=false; }
   else { var n=document.getElementById('in-'+id); if(n) n.value=''; }
   var itnode=document.getElementById('it-'+id); if(itnode) itnode.classList.remove('correct','wrong');
   var mk=document.getElementById('mk-'+id); if(mk){mk.className='mark';mk.textContent='';}
   var an=document.getElementById('an-'+id); if(an&&!TEACHER_MODE) an.classList.remove('show');
 });
 state.ex[exid].answers={}; document.getElementById('sc-'+exid).innerHTML=''; save();
}

/* ---- rule-based examiner feedback (aligned to public band descriptors) ---- */
function analyseEssay(text,x){
 var t=(text||'').trim();
 var words=t? t.split(/\s+/).length : 0;
 var sentences=(t.match(/[.!?]+/g)||[]).length || (words?1:0);
 var paras=t? t.split(/\n\s*\n/).filter(function(s){return s.trim().length>0;}).length : 0;
 var lower=' '+t.toLowerCase()+' ';
 var hasOverview=/(overall|in summary|in general|generally|it is clear|clearly|the most (striking|noticeable|obvious))/.test(lower);
 var hasData=/\d/.test(t) || /(per cent|percent|%|thousand|million|half|quarter|third)/.test(lower);
 var linkerList=['however','while','whereas','in contrast','overall','firstly','first','secondly','then','next','after that','finally','although','because','and then','in addition'];
 var linkers=linkerList.filter(function(w){return lower.indexOf(' '+w+' ')>=0;});
 var compare=/(more than|higher than|lower than|the highest|the lowest|twice|compared|whereas|while|similar|the same|than)/.test(lower);
 var passive=/\b(is|are|was|were|be|been)\s+\w+(ed|en|t|wn|nk|ut|de|ed)\b/.test(lower) || /\b(is|are)\s+(cut|put|taken|made|grown|stored|carried|formed|hunted|planted|transported|separated|killed|damaged|caused)\b/.test(lower);
 var seq=/(first|firstly|then|next|after|finally|when|once)/.test(lower);
 // repetition
 var freq={},maxw='',maxc=0;
 t.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).forEach(function(w){ if(w.length>4){freq[w]=(freq[w]||0)+1; if(freq[w]>maxc){maxc=freq[w];maxw=w;}} });
 // scoring, centred on 5
 var TA=5,CC=5,LR=5,GRA=5, tips={TA:[],CC:[],LR:[],GRA:[]};
 // TA
 if(words<x.min){ TA=words< x.min*0.66?4:4.5; tips.TA.push('Your answer is under the '+x.min+'-word minimum ('+words+' words). Short answers are penalised — write at least '+x.min+' words.'); }
 if(!hasOverview){ TA=Math.min(TA,5); tips.TA.push('Add a clear OVERVIEW sentence (e.g. "Overall, …") giving the main trend or biggest feature — this is essential in Task 1.'); }
 else { tips.TA.push('Good — an overview signal word was found. Make sure it names the main trend/biggest feature without small details.'); }
 if(!hasData){ tips.TA.push('Support your points with data from the chart (numbers, %, or fractions).'); TA=Math.min(TA,5); }
 if(x.tenseHint==='passive' && !passive){ tips.TA.push('This is a process — describe the stages using the PASSIVE (e.g. "the wheat is cut").'); }
 if(words>=x.min && hasOverview && hasData && compare){ TA=6; }
 // CC
 if(paras<2){ CC=Math.min(CC,4.5); tips.CC.push('Use paragraphs: introduction, overview, and one or two body paragraphs. Press Enter to leave a blank line between them.'); }
 else tips.CC.push('Good paragraphing ('+paras+' paragraphs).');
 if(linkers.length<3){ tips.CC.push('Use more linking words to connect ideas: however, while, whereas, firstly, then, finally.'); CC=Math.min(CC,5);}
 else { CC=Math.max(CC,5.5); tips.CC.push('Nice use of linkers: '+linkers.slice(0,5).join(', ')+'.'); }
 if(x.tenseHint==='passive' && seq) tips.CC.push('Good — sequence words help show the order of stages.');
 // LR
 if(maxc>=6){ LR=Math.min(LR,5); tips.LR.push('You repeat the word "'+maxw+'" '+maxc+' times. Use synonyms (e.g. rise/increase/grow) to widen your vocabulary.'); }
 if(!compare){ tips.LR.push('Add comparison language (more than, the highest, whereas, twice as many).'); LR=Math.min(LR,5);}
 else { LR=Math.max(LR,5.5); tips.LR.push('Comparison language is present — good for Task 1.'); }
 // GRA
 var avg = sentences? words/sentences : words;
 if(avg>32){ GRA=Math.min(GRA,5); tips.GRA.push('Some sentences may be very long ('+Math.round(avg)+' words/sentence). Break long run-on sentences into shorter, clearer ones.'); }
 if(sentences<3 && words>40){ tips.GRA.push('Use more sentences with correct full stops.'); GRA=Math.min(GRA,4.5);}
 if(x.tenseHint==='past'){ tips.GRA.push('Check your tense: the data is from the past, so use the past simple (rose, fell, increased).'); }
 if(passive && x.tenseHint==='passive'){ GRA=Math.max(GRA,5.5); tips.GRA.push('Good — passive structures were used.'); }
 var overall=Math.round((TA+CC+LR+GRA)/4*2)/2;
 return {words:words,sentences:sentences,paras:paras,overall:overall,crit:{TA:TA,CC:CC,LR:LR,GRA:GRA},tips:tips,
   flags:{hasOverview:hasOverview,hasData:hasData,compare:compare,passive:passive,linkers:linkers.length}};
}
function getFeedback(xid){
 var x=EXAM.filter(function(e){return e.id===xid;})[0];
 var ta=document.getElementById('ta-'+xid); var text=ta.value;
 var fb=analyseEssay(text,x);
 state.essays[xid].text=text; state.essays[xid].words=fb.words; state.essays[xid].fb=fb;
 var box=document.getElementById('fb-'+xid); box.innerHTML=feedbackHTML(fb); box.classList.add('show');
 var md=document.getElementById('md-'+xid); if(md) md.classList.add('show'); // unlock model after attempt
 save();
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function ovLabel(o){ return o>=6?'Strong':o>=5?'On track':'Keep practising'; }
function descriptorTableHTML(){
 var crit=['TA','CC','LR','GRA'], bands=[4,5,6,7];
 var legend='<div class="bandlegend"><span><i style="background:var(--bad)"></i>Band 4 (lowest)</span><span><i style="background:var(--warn)"></i>Band 5</span><span><i style="background:var(--brand)"></i>Band 6</span><span><i style="background:var(--good)"></i>Band 7 (highest)</span></div>';
 var s=legend+'<div class="descref"><table class="bandtable"><thead><tr><th class="critname">Criterion</th>';
 bands.forEach(function(bn){ s+='<th class="h'+bn+'">Band '+bn+'</th>'; });
 s+='</tr></thead><tbody>';
 crit.forEach(function(c){
   s+='<tr><th class="critname">'+esc(DESCR[c].name)+'<span class="cnote">'+esc(DESCR[c].note)+'</span></th>';
   bands.forEach(function(bn){ s+='<td class="b'+bn+'"><ul>'+DESCR[c].bands[bn].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></td>'; });
   s+='</tr>';
 });
 return s+'</tbody></table></div>';
}
function critStatus(v){ return v>=5.5?{t:'Good',c:'var(--good)'} : v>=5?{t:'On track',c:'var(--brand)'} : {t:'Needs work',c:'var(--warn)'}; }
function feedbackHTML(fb){
 var crit=['TA','CC','LR','GRA'];
 var ov = fb.overall>=6?'Strong Task 1 answer' : fb.overall>=5?'On the right track' : 'Keep practising';
 var head='<div class="fbhead"><div><div style="font-size:1.15rem;font-weight:800">📝 '+ov+'</div>'+
   '<div style="font-size:.8rem;opacity:.9">automatic feedback</div></div>'+
   '<div style="font-size:.86rem;margin-left:auto">'+fb.words+' words · '+fb.paras+' paragraph(s) · '+fb.sentences+' sentence(s)</div></div>';
 var row='<div class="critrow">'+crit.map(function(c){var s=critStatus(fb.crit[c]);return '<div class="crit"><div class="cn">'+DESCR[c].name+'</div><div class="cb" style="font-size:.98rem;color:'+s.c+'">'+s.t+'</div></div>';}).join('')+'</div>';
 var body='<div class="fbbody">';
 crit.forEach(function(c){ if(fb.tips[c].length){ body+='<h4>'+DESCR[c].name+'</h4><ul class="tight">'+fb.tips[c].map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'; } });
 body+='<details><summary>Band descriptors reference — what examiners look for (Bands 4–7)</summary>'+
   '<p class="footnote" style="margin:8px 0 2px">Read across each row to see how the same criterion improves from Band 4 to Band 7. Paraphrased from the public IELTS Writing Task 1 band descriptors, for study guidance.</p>'+
   descriptorTableHTML()+'</details>';
 body+='<p class="footnote">⚠️ This is automatic feedback to guide your practice, based on the public IELTS Writing assessment criteria. It is not an official IELTS result. Ask your teacher for a full assessment.</p></div>';
 return head+row+body;
}

/* ===== REPORT PANEL ===== */
function panelReport(){
 var p=document.createElement('section'); p.className='panel'; p.dataset.tab='report';
 var rows='',totTime=0,totAtt=0,mastered=0,started=0,totalEx=0,revAreas=[];
 SKILL.forEach(function(tid){
  EXDATA[tid].forEach(function(ex){
    totalEx++; var st=state.ex[ex.id]; totTime+=st.time; totAtt+=st.attempts;
    var badge = st.best>=PASS?'<span class="badge mast">Mastered</span>' : st.checked?'<span class="badge rev">Needs revision</span>':'<span class="badge none">Not started</span>';
    if(st.best>=PASS) mastered++; if(st.checked) started++;
    if(st.checked && st.best<PASS) revAreas.push(ex.area+' — <i>'+ex.title+'</i>');
    rows+='<tr><td>'+esc(ex.title)+'</td><td>'+esc(ex.area)+'</td><td class="c">'+(st.checked?pct(st.best):'—')+'</td><td class="c">'+st.attempts+'</td><td class="c">'+fmtTime(st.time)+'</td><td class="c">'+badge+'</td></tr>';
  });
 });
 var essRows=EXAM.map(function(x){ var e=state.essays[x.id]; var b=e.fb?ovLabel(e.fb.overall):'—';
   var st=(e.fb? (e.words>=x.min?'<span class="badge mast">Submitted</span>':'<span class="badge rev">Under length</span>') :'<span class="badge none">Not attempted</span>');
   return '<tr><td>'+esc(x.type)+'</td><td class="c">'+(e.words||0)+' / '+x.min+'</td><td class="c">'+b+'</td><td class="c">'+st+'</td></tr>'; }).join('');
 var revHTML = revAreas.length? '<ul class="revlist">'+revAreas.map(function(a){return '<li>'+a+'</li>';}).join('')+'</ul>' :
   (started? '<p style="color:var(--good)">🎉 No weak areas — every attempted exercise is at 80% or above. Keep it up!</p>':'<p class="lead">Do some exercises to see your areas for revision here.</p>');
 p.innerHTML=`
 <div class="card">
   <div class="kicker">Progress report</div>
   <h2>🎯 ${escOr(state.identity.name,'Your')} results</h2>
   <div class="statrow">
     <div class="stat"><div class="v">${mastered}/${totalEx}</div><div class="l">Exercises mastered (80%+)</div></div>
     <div class="stat"><div class="v">${started}/${totalEx}</div><div class="l">Exercises attempted</div></div>
     <div class="stat"><div class="v">${fmtTime(totTime)}</div><div class="l">Total time on exercises</div></div>
     <div class="stat"><div class="v">${totAtt}</div><div class="l">Total attempts</div></div>
   </div>
   <div class="exfoot" style="border:0;padding:0;margin-bottom:6px">
     <button class="btn sm" onclick="window.print()">🖨 Print / Save PDF</button>
     <button class="btn ghost sm" onclick="sendToSheet()">☁️ Submit results to teacher</button>
     <span class="footnote" id="sheetMsg"></span>
   </div>
 </div>
 <div class="card">
   <h3>Detailed results by exercise</h3>
   <div style="overflow:auto"><table class="report"><thead><tr><th>Exercise</th><th>Area</th><th>Best score</th><th>Attempts</th><th>Time</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
 </div>
 <div class="card">
   <h3>Exam-practice writing</h3>
   <div style="overflow:auto"><table class="report"><thead><tr><th>Task</th><th>Words</th><th>Feedback</th><th>Status</th></tr></thead><tbody>${essRows}</tbody></table></div>
 </div>
 <div class="card">
   <h3>📌 Areas needing revision</h3>
   ${revHTML}
   <p class="footnote">Tip: re-read the review at the top of each tab, then redo the exercise until you reach 80%.</p>
 </div>
 ${TEACHER_MODE ? sheetSetupHTML()+feedbackSetupHTML() : ''}`;
 return p;
}

function sheetSetupHTML(){
 return `<div class="card">
  <h3>☁️ Send student results to Google Sheets (automatic)</h3>
  <p class="lead">Link every student's results to your sheet automatically. One-time setup (~5 minutes):</p>
  <ol class="tight">
    <li>Open your Google Sheet, then <b>Extensions → Apps Script</b>.</li>
    <li>Delete anything there and paste the code below. Press <b>💾 Save</b>.</li>
    <li>Press <b>Deploy → New deployment → Web app</b>. Set <b>"Who has access" = Anyone</b>, then <b>Deploy</b> and copy the <b>Web app URL</b>.</li>
    <li>Open each HTML file in a plain text editor, find the line <code>var GOOGLE_SCRIPT_URL = "";</code> near the top, and paste your URL between the quotes. Save.</li>
    <li>Students press <b>"Submit results to teacher"</b> (above) — a new row is added to your sheet each time.</li>
  </ol>
  <details><summary>Show the Apps Script code (copy all)</summary>
<pre class="code">function doPost(e){
  var sheet = SpreadsheetApp.openById('1th1j6bJLPrfadgT4IYiwgdvNpR5v2MCLYOSsemZRUC8')
                .getSheetByName('Sheet1') || SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  var d = JSON.parse(e.postData.contents);
  if(sheet.getLastRow()===0){
    sheet.appendRow(['Timestamp','Name','Email','Mastered','Attempted','TotalMinutes','TotalAttempts','ExerciseScores','EssayFeedback']);
  }
  sheet.appendRow([new Date(), d.name, d.email, d.mastered, d.attempted, d.minutes,
                   d.attempts, JSON.stringify(d.scores), JSON.stringify(d.bands)]);
  return ContentService.createTextOutput(JSON.stringify({ok:true}))
           .setMimeType(ContentService.MimeType.JSON);
}</pre></details>
  <p class="footnote">Your sheet: <a href="https://docs.google.com/spreadsheets/d/1th1j6bJLPrfadgT4IYiwgdvNpR5v2MCLYOSsemZRUC8/edit" target="_blank" rel="noopener">open in Google Sheets ↗</a>. The Apps Script already points to this sheet's ID. (Browsers block writing to Sheets directly, which is why the tiny Apps Script "bridge" is needed.)</p>
 </div>`;
}
function feedbackSetupHTML(){
 return `<div class="card">
  <h3>🤖 How the automatic examiner feedback works — and how to upgrade it</h3>
  <p class="lead">The <b>Get examiner feedback</b> button already gives instant feedback aligned to the four official IELTS Task 1 criteria (Task Achievement, Coherence &amp; Cohesion, Lexical Resource, Grammatical Range &amp; Accuracy). It checks length, overview, use of data, comparisons, paragraphing, linking words, repetition, sentence length and (for processes) the passive.</p>
  <details><summary>Want richer, AI-examiner feedback? (optional upgrade)</summary>
   <p>To have each answer marked live by an AI model prompted as an IELTS examiner, you can connect an AI API. Outline:</p>
   <ol class="tight">
     <li>Get an API key from an AI provider (e.g. Anthropic or OpenAI).</li>
     <li>Because a browser must not expose your key, create a small proxy — the <b>same Google Apps Script</b> can call the API with <code>UrlFetchApp.fetch()</code> using your key stored in <b>Project Settings → Script properties</b>.</li>
     <li>Send the student's text to that endpoint with a prompt such as: <i>"You are a strict IELTS examiner. Using the official Writing Task 1 band descriptors (ielts.org), assess each of the four criteria and give 2 tips each. Text: …"</i></li>
     <li>Show the returned JSON in the feedback box.</li>
   </ol>
   <p class="footnote">The official descriptors this feedback follows: <a href="https://ielts.org/cdn/Guides/ielts-writing-band-descriptors.pdf" target="_blank" rel="noopener">ielts.org Writing band descriptors (PDF) ↗</a>. Keep any API key on the server side (Apps Script), never in this HTML file.</p>
  </details>
 </div>`;
}

function sendToSheet(){
 var msg=document.getElementById('sheetMsg');
 var payload=buildPayload();
 if(!GOOGLE_SCRIPT_URL){ msg.innerHTML='<span style="color:var(--warn)">Result submission has not been set up yet. Your results are saved on this device.</span>'; return; }
 if(!state.identity.name||!state.identity.email){ msg.innerHTML='<span style="color:var(--warn)">Please add your name and email on the "Start here" tab first.</span>'; return; }
 msg.textContent='Sending…';
 fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)})
  .then(function(){ msg.innerHTML='<span style="color:var(--good)">✓ Results submitted to your teacher.</span>'; })
  .catch(function(){ msg.innerHTML='<span style="color:var(--bad)">Could not send (check the URL / internet). Results are saved on this device.</span>'; });
}
function buildPayload(){
 var scores={},bands={},totTime=0,totAtt=0,mast=0,att=0,total=0;
 SKILL.forEach(function(tid){EXDATA[tid].forEach(function(ex){var st=state.ex[ex.id];total++;totTime+=st.time;totAtt+=st.attempts;if(st.best>=PASS)mast++;if(st.checked)att++;scores[ex.id]=Math.round(st.best*100)+'%';});});
 EXAM.forEach(function(x){var e=state.essays[x.id];bands[x.type]=e.fb?ovLabel(e.fb.overall):null;});
 return {name:state.identity.name,email:state.identity.email,mastered:mast+'/'+total,attempted:att+'/'+total,minutes:Math.round(totTime/60),attempts:totAtt,scores:scores,bands:bands};
}

/* ============================ small utils ============================ */
function findEx(id){ var f=null; Object.keys(EXDATA).forEach(function(k){EXDATA[k].forEach(function(ex){if(ex.id===id)f=ex;});}); return f; }
function norm(s){ return String(s).toLowerCase().trim().replace(/[.,;:!?"']/g,'').replace(/\s+/g,' '); }
function pct(x){ return Math.round(x*100)+'%'; }
function fmtTime(sec){ sec=Math.round(sec||0); var m=Math.floor(sec/60),s=sec%60; return m+':'+(s<10?'0':'')+s; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escOr(s,d){ return s? esc(s)+"'s" : d; }

/* ---- inputs: identity + essays + autosave-on-type + active-exercise tracking ---- */
function wireInputs(){
 var nm=document.getElementById('nm'), em=document.getElementById('em');
 if(nm) nm.oninput=function(){ state.identity.name=nm.value; scheduleSave(); };
 if(em) em.oninput=function(){ state.identity.email=em.value; scheduleSave(); };
 EXAM.forEach(function(x){ var ta=document.getElementById('ta-'+x.id); if(ta){ ta.oninput=function(){ state.essays[x.id].text=ta.value; var w=ta.value.trim()?ta.value.trim().split(/\s+/).length:0; state.essays[x.id].words=w; var wc=document.getElementById('wc-'+x.id); if(wc)wc.textContent=w; scheduleSave(); }; } });
 // save answers on change for exercises
 document.querySelectorAll('.exercise').forEach(function(card){
   card.addEventListener('input',function(){ persistAnswers(card.dataset.ex); });
   card.addEventListener('pointerdown',function(){ activeEx=card.dataset.ex; });
   card.addEventListener('focusin',function(){ activeEx=card.dataset.ex; });
 });
 var who=document.getElementById('whoPill'); if(who&&state.identity.name){ who.style.display=''; who.textContent='👤 '+state.identity.name; }
}
function persistAnswers(exid){
 var ex=findEx(exid); if(!ex) return; var ans={};
 ex.items.forEach(function(it,i){ ans[i]=readItem(ex,it,i); });
 state.ex[exid].answers=ans; scheduleSave();
}
var saveTimer=null;
function scheduleSave(){ if(saveTimer) return; saveTimer=setTimeout(function(){ saveTimer=null; save(); },800); }

/* ---- timer: count time on the active exercise ---- */
var activeEx=null;
setInterval(function(){
 if(!document.hidden && activeEx && state.ex[activeEx]){
   state.ex[activeEx].time++;
   var tm=document.getElementById('tm-'+activeEx); if(tm) tm.textContent=fmtTime(state.ex[activeEx].time);
 }
},1000);
/* ---- autosave every 10s ---- */
setInterval(function(){ save(); }, 10000);
window.addEventListener('beforeunload', save);

/* ---- theme ---- */
function applyTheme(){ if(state.theme) document.documentElement.setAttribute('data-theme',state.theme); else document.documentElement.removeAttribute('data-theme'); }
document.getElementById('themeBtn').onclick=function(){
 var cur=state.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 state.theme = cur==='dark'?'light':'dark'; applyTheme(); save();
};

/* ============================ INIT ============================ */
(function init(){
 if(TEACHER_MODE){ document.getElementById('teacherBanner').style.display='block'; document.getElementById('verPill').textContent='Teacher'; }
 applyTheme();
 renderTabs(); renderPanels();
})();
</script>
</body>
</html>
